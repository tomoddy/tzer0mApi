name: Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, tzer0m]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stop service
        run: sudo systemctl stop Api.service
      - name: Publish
        run: dotnet publish tzer0mApi/tzer0mApi.csproj -c Release -o /home/tzer0m/Services/Api
      - name: Start service
        run: sudo systemctl start Api.service
      - name: Check status
        run: sudo systemctl status Api.service --no-pager
